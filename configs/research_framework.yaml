protocol_version: research-framework-v1
scientific_question: "How much future communication information does an autonomous robot need for robust motion planning under uncertain connectivity?"

benchmark:
  seeds: 20
  mc_samples: 32
  bootstrap_samples: 10000
  planners: [P0, P1, P2, P3, P4]

risk_aware:
  enabled: true
  alpha_values: [0.8, 0.9, 0.95]
  risk_weights: [0.0, 0.25, 0.5, 1.0, 2.0]

chance_constraints:
  enabled: true
  outage_thresholds: [0.01, 0.05, 0.1]
  violation_probabilities: [0.01, 0.05, 0.1, 0.2]

adaptive_weight:
  enabled: true
  base_weights: [0.25, 0.5, 1.0]
  max_weights: [1.0, 2.0, 4.0]
  risk_activation_thresholds: [0.05, 0.1, 0.2]

prediction_horizon_s: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
connectivity_weights: [0.0, 0.25, 0.5, 1.0, 2.0, 4.0]
mc_sample_budgets: [1, 4, 8, 16, 32, 64]

distribution_shift:
  bias_db: [0.0, 1.0, 2.0, 4.0]
  noise_scale: [1.0, 1.5, 2.0, 3.0]
  observation_delay_s: [0.0, 0.2, 0.5, 1.0]
  propagation_mismatch_scale: [1.0, 1.1, 1.25, 1.5]

blackout_scenarios:
  - sudden_blockage
  - persistent_nlos
  - intermittent_link
  - rapid_degradation

reporting:
  paired_effects:
    - [P1, P2]
    - [P2, P3]
    - [P2, P4]
  primary_metrics:
    - outage_rate
    - mean_snr_db
    - goodput_bps
    - progress_m
    - collision
  compute_metrics:
    - planning_time_s
    - candidate_evaluations
  retain_negative_results: true
  separate_safety_claims: true
