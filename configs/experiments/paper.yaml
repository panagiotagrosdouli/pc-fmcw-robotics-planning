name: pc_fmcw_robotics_simulation
seed_start: 0
seeds: 30

simulation:
  dt_s: 0.1
  history_steps: 8
  horizon_steps: 20
  observation_sigma_m: 0.20
  prediction_sigma_m: 0.75
  connectivity_weight: 1.0
  p3_mc_samples: 32
  collision_distance_m: 2.0

link:
  waveform_source: "PanagiotaGr/ISCAI_pc_fmcw Module 0"
  carrier_frequency_hz: 193.4e12
  chirp_bandwidth_hz: 10.0e9
  chirp_duration_s: 10.0e-6
  data_rate_bps: 1.0e9
  geometry_model: "declared simulation assumption; not measured optical link"

outputs:
  root: results/pc_fmcw_sim

notes:
  target_motion: "parameterized synthetic scenario families"
  ego_motion: "simulated receding-horizon bicycle-model control"
  predictor_fairness: "P2 and P3 share the same constant-velocity mean prediction"
  oracle_rule: "P4 alone may access future simulated target truth"
  optical_claim_rule: "Waveform parameters are traced to the upstream notebook; geometry-to-SNR and outage are simulation models, not measurements."
  validation_rule: "Do not describe this benchmark as real-world or real-vehicle validation."
