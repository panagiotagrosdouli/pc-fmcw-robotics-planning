name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib pandas pyyaml pytest scikit-learn h5py huggingface_hub
      - name: Unit and integration smoke tests
        run: python -m pytest
      - name: Stage-9 legacy synthetic smoke run
        run: python scripts/run_stage9.py
      - name: Dataset-free PC-FMCW robotics smoke run
        run: python scripts/run_pc_fmcw_robotics_benchmark.py --seeds 1 --mc-samples 2 --output-dir results/pc_fmcw_ci
      - name: Paired statistical analysis smoke run
        run: python scripts/analyze_pc_fmcw_benchmark.py --input results/pc_fmcw_ci/episodes.csv --output-dir results/pc_fmcw_ci --bootstrap-samples 100
      - name: Robustness sweep smoke run
        run: python scripts/run_pc_fmcw_robustness_sweep.py --seeds 1 --mc-samples 2 --output-dir results/pc_fmcw_robustness_ci
      - name: Paper manifest dry run
        run: python scripts/run_paper_experiments.py --dry-run
      - name: Verify expected synthetic outputs
        run: |
          test -s results/stage9_primary.csv
          test -s results/stage9_summary.csv
          test -s results/stage9_outage_vs_travel_time.png
          test -s results/pc_fmcw_ci/episodes.csv
          test -s results/pc_fmcw_ci/summary.csv
          test -s results/pc_fmcw_ci/manifest.json
          test -s results/pc_fmcw_ci/paired_effects.csv
          test -s results/pc_fmcw_ci/scenario_summary.csv
          test -s results/pc_fmcw_robustness_ci/episodes.csv
          test -s results/pc_fmcw_robustness_ci/summary.csv
          test -s results/pc_fmcw_robustness_ci/manifest.json

  transformer-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch pytest
      - name: Transformer smoke check
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import torch
          from iscai.prediction.transformer import TrajectoryTransformer
          model = TrajectoryTransformer(horizon=4)
          x = torch.zeros(2, 8, 2)
          mean, log_sigma = model(x)
          assert mean.shape == (2, 4, 2)
          assert log_sigma.shape == (2, 4, 2)
          print('transformer smoke ok')
          PY
