name: Real V2X research smoke
on:
  pull_request:
    paths:
      - 'src/iscai/connectivity/real_v2x/**'
      - 'scripts/prepare_cicv5g.py'
      - 'scripts/run_real_v2x_support_study.py'
      - 'scripts/analyze_real_v2x_support_study.py'
      - 'scripts/run_real_v2x_horizon_study.py'
      - 'scripts/analyze_real_v2x_horizon_study.py'
      - 'scripts/analyze_real_v2x_multisplit.py'
      - 'scripts/run_real_v2x_replay_planning.py'
      - 'scripts/analyze_real_v2x_replay_planning.py'
      - 'scripts/analyze_real_v2x_replay_multisplit.py'
      - 'tests/test_real_v2x.py'
      - '.github/workflows/real_v2x_research.yml'
  workflow_dispatch:

jobs:
  measured-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install numpy pandas scipy scikit-learn matplotlib pytest
      - run: python -m pytest -q tests/test_real_v2x.py
      - name: Download public CICV5G W2S measurements
        run: python scripts/prepare_cicv5g.py --output data/raw/cicv5g
      - name: Run leakage-safe measured-data study
        run: PYTHONPATH=src python scripts/run_real_v2x_support_study.py --data data/raw/cicv5g --output results/real_v2x_support
      - name: Analyze measured-data study
        run: python scripts/analyze_real_v2x_support_study.py --input results/real_v2x_support --bootstrap 1000
      - name: Run causal horizon-adaptive fusion study
        run: PYTHONPATH=src python scripts/run_real_v2x_horizon_study.py --data data/raw/cicv5g --output results/real_v2x_horizon
      - name: Analyze causal horizon-adaptive fusion study
        run: python scripts/analyze_real_v2x_horizon_study.py --input results/real_v2x_horizon --bootstrap 1000
      - name: Run grouped multi-split prediction robustness
        run: |
          for seed in 0 1 2 3 4; do
            PYTHONPATH=src python scripts/run_real_v2x_horizon_study.py \
              --data data/raw/cicv5g \
              --output results/real_v2x_multisplit/seed_${seed} \
              --seed ${seed}
          done
          python scripts/analyze_real_v2x_multisplit.py --root results/real_v2x_multisplit
      - name: Run primary route-constrained measured-support replay planner
        run: PYTHONPATH=src python scripts/run_real_v2x_replay_planning.py --data data/raw/cicv5g --output results/real_v2x_replay --seed 0
      - name: Analyze primary replay with multiplicity-corrected run-level statistics
        run: python scripts/analyze_real_v2x_replay_planning.py --input results/real_v2x_replay --bootstrap 2000
      - name: Run grouped multi-split measured-support replay
        run: |
          for seed in 0 1 2 3 4; do
            PYTHONPATH=src python scripts/run_real_v2x_replay_planning.py \
              --data data/raw/cicv5g \
              --output results/real_v2x_replay_multisplit/seed_${seed} \
              --seed ${seed}
            python scripts/analyze_real_v2x_replay_planning.py \
              --input results/real_v2x_replay_multisplit/seed_${seed} \
              --bootstrap 1000
          done
          python scripts/analyze_real_v2x_replay_multisplit.py \
            --root results/real_v2x_replay_multisplit \
            --bootstrap 5000
      - uses: actions/upload-artifact@v4
        with:
          name: real-v2x-research-study
          path: |
            results/real_v2x_support/
            results/real_v2x_horizon/
            results/real_v2x_multisplit/
            results/real_v2x_replay/
            results/real_v2x_replay_multisplit/
