name: Manuscript PDF CI

on:
  pull_request:
    paths:
      - 'manuscripts/**'
      - '.github/workflows/manuscript_ci.yml'
  workflow_dispatch:

jobs:
  latex-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers
      - name: Compile all manuscript sources
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r tex; do
            found=1
            dir=$(dirname "$tex")
            file=$(basename "$tex")
            echo "Compiling $tex"
            (cd "$dir" && pdflatex -interaction=nonstopmode -halt-on-error "$file" && pdflatex -interaction=nonstopmode -halt-on-error "$file")
          done < <(find manuscripts -type f -name 'paper*.tex' | sort)
          if [ "$found" -eq 0 ]; then
            echo 'No manuscript .tex sources found' >&2
            exit 1
          fi
      - name: Reject unresolved LaTeX markers
        run: |
          if grep -RInE 'TODO|TBD|undefined references|Citation.*undefined' manuscripts --include='*.tex'; then
            echo 'Unresolved manuscript markers detected' >&2
            exit 1
          fi
      - name: Collect PDFs
        run: |
          mkdir -p manuscript-pdfs
          find manuscripts -type f -name 'paper*.pdf' -exec cp {} manuscript-pdfs/ \;
          test -n "$(find manuscript-pdfs -type f -name '*.pdf' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdfs
          path: manuscript-pdfs/
          retention-days: 90
