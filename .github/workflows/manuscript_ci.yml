name: Manuscript PDF CI

on:
  pull_request:
    paths:
      - 'manuscripts/**'
      - 'scripts/build_paper2_publication_assets.py'
      - '.github/workflows/manuscript_ci.yml'
  workflow_dispatch:

jobs:
  latex-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install manuscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib
      - name: Regenerate Paper 2 publication assets when snapshot exists
        run: |
          if [ -f manuscripts/paper2_real_v2x/results_archive/predictor_metrics.csv ]; then
            python scripts/build_paper2_publication_assets.py \
              manuscripts/paper2_real_v2x/results_archive \
              --out manuscripts/paper2_real_v2x/generated
          fi
      - name: Compile all manuscript sources
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r tex; do
            found=1
            dir=$(dirname "$tex")
            file=$(basename "$tex")
            echo "Compiling $tex"
            (cd "$dir" && pdflatex -interaction=nonstopmode -halt-on-error "$file" && pdflatex -interaction=nonstopmode -halt-on-error "$file")
          done < <(find manuscripts -type f -name 'paper*.tex' | sort)
          if [ "$found" -eq 0 ]; then
            echo 'No manuscript .tex sources found' >&2
            exit 1
          fi
      - name: Reject unresolved manuscript markers
        run: |
          if grep -RInE 'TODO|TBD|undefined references|Citation.*undefined' manuscripts --include='*.tex'; then
            echo 'Unresolved manuscript markers detected' >&2
            exit 1
          fi
      - name: Collect manuscript outputs
        run: |
          mkdir -p manuscript-artifacts
          find manuscripts -type f \( -name 'paper*.pdf' -o -path '*/generated/*.pdf' -o -path '*/generated/*.svg' -o -path '*/generated/*.tex' -o -path '*/generated/*.csv' \) -exec cp --parents {} manuscript-artifacts/ \;
          test -n "$(find manuscript-artifacts -type f -name 'paper*.pdf' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-publication-assets
          path: manuscript-artifacts/
          retention-days: 90
