name: Part B frozen confirmatory

on:
  pull_request:
    paths:
      - 'configs/experiments/part_b_final.yaml'
      - 'scripts/run_pc_fmcw_robotics_benchmark.py'
      - 'scripts/analyze_pc_fmcw_benchmark.py'
      - 'scripts/diagnose_pc_fmcw_benchmark.py'
      - 'scripts/run_pc_fmcw_geometry_ablation.py'
      - 'scripts/analyze_pc_fmcw_geometry_ablation.py'
      - 'scripts/build_part_b_confirmatory_report.py'
      - 'scripts/build_dual_branch_evidence_table.py'
      - 'docs/paper/DUAL_BRANCH_ANALYSIS.md'
      - '.github/workflows/part_b_confirmatory.yml'
  workflow_dispatch:

jobs:
  frozen-confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib pandas pyyaml scikit-learn h5py huggingface_hub
      - name: Record provenance
        run: |
          mkdir -p results/part_b_final
          git rev-parse HEAD > results/part_b_final/commit_sha.txt
          python --version > results/part_b_final/python_version.txt
          python -m pip freeze > results/part_b_final/pip_freeze.txt
          cp configs/experiments/part_b_final.yaml results/part_b_final/protocol.yaml
      - name: Run frozen 50-seed P0-P4 confirmatory benchmark
        run: |
          python scripts/run_pc_fmcw_robotics_benchmark.py \
            --seed-start 1000 \
            --seeds 50 \
            --dt 0.1 \
            --history 8 \
            --horizon 20 \
            --observation-sigma-m 0.20 \
            --prediction-sigma-m 0.75 \
            --connectivity-weight 1.0 \
            --mc-samples 32 \
            --collision-distance-m 2.0 \
            --output-dir results/part_b_final
      - name: Run confirmatory paired analysis
        run: |
          python scripts/analyze_pc_fmcw_benchmark.py \
            --input results/part_b_final/episodes.csv \
            --output-dir results/part_b_final \
            --bootstrap-samples 100000
      - name: Run scenario safety and feasibility diagnostics
        run: |
          python scripts/diagnose_pc_fmcw_benchmark.py \
            --input results/part_b_final/episodes.csv \
            --output-dir results/part_b_final/diagnostics
      - name: Build artifact-derived manuscript report
        run: |
          python scripts/build_part_b_confirmatory_report.py \
            --input-dir results/part_b_final \
            --output results/part_b_final/CONFIRMATORY_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: part-b-final-v1-confirmatory
          path: results/part_b_final/
          retention-days: 90

  optical-geometry-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install numpy scipy pandas scikit-learn
      - name: Run paired directional-vs-distance-only mechanism ablation
        run: |
          python scripts/run_pc_fmcw_geometry_ablation.py \
            --seed-start 2000 \
            --seeds 20 \
            --mc-samples 32 \
            --output-dir results/pc_fmcw_geometry_ablation
          python scripts/analyze_pc_fmcw_geometry_ablation.py \
            --input results/pc_fmcw_geometry_ablation/episodes.csv \
            --output-dir results/pc_fmcw_geometry_ablation \
            --bootstrap 10000
      - uses: actions/upload-artifact@v4
        with:
          name: pc-fmcw-geometry-ablation
          path: results/pc_fmcw_geometry_ablation/
          retention-days: 90
