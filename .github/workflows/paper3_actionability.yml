name: Paper 3 actionability checks

on:
  pull_request:
    paths:
      - 'src/iscai/evaluation/actionability.py'
      - 'tests/test_actionability.py'
      - 'configs/experiments/paper3_actionability.yaml'
      - 'docs/paper3/**'
      - '.github/workflows/paper3_actionability.yml'
  push:
    branches:
      - research/paper3-actionability
    paths:
      - 'src/iscai/evaluation/actionability.py'
      - 'tests/test_actionability.py'
      - 'configs/experiments/paper3_actionability.yaml'
      - 'docs/paper3/**'
      - '.github/workflows/paper3_actionability.yml'
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pytest
      - name: Run Paper 3 actionability tests
        run: python -m pytest -q tests/test_actionability.py
