name: Paper Experiments

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of paired Monte Carlo seeds"
        required: true
        default: "20"
      mc_samples:
        description: "P3 Monte Carlo target samples"
        required: true
        default: "32"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper_experiments.yml"

env:
  PAPER_SEEDS: ${{ github.event.inputs.seeds || '20' }}
  PAPER_MC_SAMPLES: ${{ github.event.inputs.mc_samples || '32' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib pandas pyyaml scikit-learn h5py huggingface_hub
      - name: Run benchmark and paired analysis
        run: |
          python scripts/run_pc_fmcw_robotics_benchmark.py --seeds "$PAPER_SEEDS" --mc-samples "$PAPER_MC_SAMPLES" --output-dir results/paper/benchmark
          python scripts/analyze_pc_fmcw_benchmark.py --input results/paper/benchmark/episodes.csv --output-dir results/paper/benchmark --bootstrap-samples 10000
      - uses: actions/upload-artifact@v4
        with:
          name: paper-benchmark
          path: results/paper/benchmark
          retention-days: 30

  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib pandas pyyaml scikit-learn h5py huggingface_hub
      - name: Run robustness seed shard
        run: |
          SHARD_SIZE=$(( PAPER_SEEDS / 4 ))
          START=$(( ${{ matrix.shard }} * SHARD_SIZE ))
          if [ "${{ matrix.shard }}" -eq 3 ]; then COUNT=$(( PAPER_SEEDS - START )); else COUNT=$SHARD_SIZE; fi
          python scripts/run_pc_fmcw_robustness_sweep.py --seeds "$COUNT" --seed-start "$START" --mc-samples "$PAPER_MC_SAMPLES" --output-dir "results/paper/robustness-shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: robustness-shard-${{ matrix.shard }}
          path: results/paper/robustness-shard-${{ matrix.shard }}
          retention-days: 30
