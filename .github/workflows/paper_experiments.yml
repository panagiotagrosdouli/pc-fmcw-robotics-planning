name: Paper Experiments

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of paired Monte Carlo seeds"
        required: true
        default: "20"
      mc_samples:
        description: "P3 Monte Carlo target samples"
        required: true
        default: "32"

jobs:
  paper-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate experiment inputs
        env:
          PAPER_SEEDS: ${{ inputs.seeds }}
          PAPER_MC_SAMPLES: ${{ inputs.mc_samples }}
        run: |
          python - <<'PY'
          import os
          for name in ('PAPER_SEEDS', 'PAPER_MC_SAMPLES'):
              raw = os.environ[name]
              try:
                  value = int(raw)
              except ValueError as exc:
                  raise SystemExit(f'{name} must be an integer, got {raw!r}') from exc
              if value < 1:
                  raise SystemExit(f'{name} must be >= 1, got {value}')
          PY
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib pandas pyyaml scikit-learn h5py huggingface_hub
      - name: Run dataset-free PC-FMCW benchmark
        run: |
          python scripts/run_pc_fmcw_robotics_benchmark.py \
            --seeds "${{ inputs.seeds }}" \
            --mc-samples "${{ inputs.mc_samples }}" \
            --output-dir results/paper/benchmark
      - name: Run paired statistical analysis
        run: |
          python scripts/analyze_pc_fmcw_benchmark.py \
            --input results/paper/benchmark/episodes.csv \
            --output-dir results/paper/benchmark \
            --bootstrap-samples 10000
      - name: Run robustness sweeps
        run: |
          python scripts/run_pc_fmcw_robustness_sweep.py \
            --seeds "${{ inputs.seeds }}" \
            --mc-samples "${{ inputs.mc_samples }}" \
            --output-dir results/paper/robustness
      - name: Generate robustness figures with uncertainty
        run: |
          python scripts/plot_pc_fmcw_robustness.py \
            --episodes results/paper/robustness/episodes.csv \
            --bootstrap-samples 10000 \
            --bootstrap-seed 2026 \
            --output-dir results/paper/robustness/figures
      - name: Record reproducibility metadata
        env:
          PAPER_SEEDS: ${{ inputs.seeds }}
          PAPER_MC_SAMPLES: ${{ inputs.mc_samples }}
        run: |
          python - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          out = Path('results/paper/reproducibility.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          metadata = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'python': sys.version,
              'platform': platform.platform(),
              'seeds': int(os.environ['PAPER_SEEDS']),
              'p3_mc_samples': int(os.environ['PAPER_MC_SAMPLES']),
              'paired_analysis_bootstrap_samples': 10000,
              'robustness_bootstrap_samples': 10000,
              'robustness_bootstrap_seed': 2026,
              'claim_boundary': 'PC-FMCW-informed controlled simulation; not measured optical or real-vehicle validation.',
          }
          out.write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Upload paper experiment bundle
        uses: actions/upload-artifact@v4
        with:
          name: pc-fmcw-paper-experiments-${{ github.sha }}
          path: results/paper
          if-no-files-found: error
          retention-days: 30
