name: Paper Experiments

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of paired Monte Carlo seeds"
        required: true
        default: "20"
      mc_samples:
        description: "P3 Monte Carlo target samples"
        required: true
        default: "32"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper_experiments.yml"

env:
  PAPER_SEEDS: ${{ github.event.inputs.seeds || '20' }}
  PAPER_MC_SAMPLES: ${{ github.event.inputs.mc_samples || '32' }}

jobs:
  prepare-robustness:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.matrix.outputs.seeds }}
    steps:
      - id: matrix
        name: Build requested seed matrix
        env:
          SEED_COUNT: ${{ env.PAPER_SEEDS }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          count = int(os.environ["SEED_COUNT"])
          if count < 1:
              raise SystemExit("seeds must be positive")
          print("seeds=" + json.dumps(list(range(count))))
          PY

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib pandas pyyaml scikit-learn h5py huggingface_hub
      - name: Run benchmark and paired analysis
        run: |
          python scripts/run_pc_fmcw_robotics_benchmark.py --seeds "$PAPER_SEEDS" --mc-samples "$PAPER_MC_SAMPLES" --output-dir results/paper/benchmark
          python scripts/analyze_pc_fmcw_benchmark.py --input results/paper/benchmark/episodes.csv --output-dir results/paper/benchmark --bootstrap-samples 10000
          python scripts/diagnose_pc_fmcw_benchmark.py --input results/paper/benchmark/episodes.csv --output-dir results/paper/benchmark/diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: paper-benchmark
          path: results/paper/benchmark
          retention-days: 30

  robustness:
    needs: prepare-robustness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: ${{ fromJSON(needs.prepare-robustness.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib pandas pyyaml scikit-learn h5py huggingface_hub
      - name: Run one robustness seed
        run: python scripts/run_pc_fmcw_robustness_sweep.py --seeds 1 --seed-start "${{ matrix.seed }}" --mc-samples "$PAPER_MC_SAMPLES" --output-dir "results/paper/robustness-seed-${{ matrix.seed }}"
      - uses: actions/upload-artifact@v4
        with:
          name: robustness-seed-${{ matrix.seed }}
          path: results/paper/robustness-seed-${{ matrix.seed }}
          retention-days: 30

  aggregate-robustness:
    needs: robustness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install numpy pandas matplotlib
      - name: Download all robustness seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: robustness-seed-*
          path: results/paper/shards
      - name: Merge episodes and generate figures
        run: |
          python scripts/merge_pc_fmcw_robustness_shards.py --input-root results/paper/shards --output-dir results/paper/robustness --expected-seeds "$PAPER_SEEDS"
          python scripts/plot_pc_fmcw_robustness.py --episodes results/paper/robustness/episodes.csv --output-dir results/paper/robustness/figures --bootstrap-samples 10000 --bootstrap-seed 2026
      - uses: actions/upload-artifact@v4
        with:
          name: paper-robustness-aggregated
          path: results/paper/robustness
          retention-days: 30
